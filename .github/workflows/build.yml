name: Build 3105 IPA
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - name: Fix project
        run: |
          sed -i '' '/RepositoryHomeView/d' ThreeOneOSFive.xcodeproj/project.pbxproj
          sed -i '' '/RepositorySourcesView/d' ThreeOneOSFive.xcodeproj/project.pbxproj
          python3 .github/scripts/fix_pbxproj.py
      - name: Build
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild archive -project ThreeOneOSFive.xcodeproj -scheme 3105 -configuration Release -sdk iphoneos -archivePath build/3105.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO SKIP_INSTALL=NO 2>&1 | tee build.log
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Package IPA
        run: |
          set -e
          APP=$(find build/3105.xcarchive -name "*.app" -type d | head -1)
          echo "App: $APP"
          test -n "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/3105.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload 3105-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: 3105-unsigned.ipa
          if-no-files-found: error
