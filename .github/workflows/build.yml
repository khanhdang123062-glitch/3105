      - name: Build unsigned app
        run: |
          set -e
          rm -rf build
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build.log; \
          grep ": error:" build.log > errors.txt || true; \
          cat errors.txt; \
          grep -q ": error:" build.log && exit 1 || exit 0

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-errors
          path: errors.txt
