name: Build 3105 IPA
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - name: Build unsigned app
        run: |
          set -e
          rm -rf build
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build.log; grep ": error:" build.log > errors.txt || true; cat errors.txt; grep -q ": error:" build.log && exit 1 || exit 0
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-errors
          path: errors.txt
      - name: Package IPA
        run: |
          set -e
          echo "=== Finding .app ==="
          find build/DerivedData/Build/Products -name "*.app" -type d
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -1)
          echo "Using: $APP_PATH"
          echo "=== App contents ==="
          ls -la "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/3105.app
          echo "=== Payload contents ==="
          ls -la Payload/3105.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload 3105-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: 3105-unsigned.ipa
          if-no-files-found: error
